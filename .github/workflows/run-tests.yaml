on:
  push:
    branches:
      - master
  pull_request:

name: Run unit tests

jobs:
  test:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
        - {
            name: "Ubuntu Latest GCC, coverage enabled", 
            os: ubuntu-latest,
            cov: true
          }
        - {
            name: "Ubuntu Latest GCC, coverage enabled", 
            os: ubuntu-latest,
            release: true
          }


    steps:
    - uses: actions/checkout@v7

    - name: Get latest CMake
      uses: lukka/get-cmake@latest

    - uses: actions/cache@v4
      id: cache
      with:
        path: libtiledb
        key: tiledb-2.30.1

    - name: Install TileDB
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        mkdir libtiledb
        cd libtiledb
        wget https://github.com/TileDB-Inc/TileDB/releases/download/2.30.1/tiledb-linux-x86_64-2.30.1-6ea48ca.tar.gz -O tiledb.tar.gz
        tar -xvf tiledb.tar.gz

    - name: Configure the build with coverage
      if: ${{ matrix.config.cov }}
      run: cmake -S . -B build -DCODE_COVERAGE=ON -DCMAKE_PREFIX_PATH=libtiledb -DCMAKE_BUILD_TYPE=Debug

    - name: Configure release build
      if: ${{ matrix.config.release }}
      run: cmake -S . -B build -DCMAKE_PREFIX_PATH=libtiledb -DCMAKE_BUILD_TYPE=Release

    - name: Run the build
      run: cmake --build build

    - name: Run the tests
      run: |
        cd build/tests
        # Avoid using ctest because it's so slow; it starts a
        # new process for each individual test, which is crazy.
        for exe in $(ls *test)
        do
            echo "#### RUNNING ${exe} ####"
            echo 
            ./${exe} --gtest_brief=1
            echo
        done 

    - name: Generate code coverage
      if: ${{ matrix.config.cov }}
      run: |
        cd build/tests/CMakeFiles/
        find -type f -name "*.gcno" -execdir gcov -abcfu {} +

    - name: Upload to Codecov
      if: ${{ matrix.config.cov }}
      uses: codecov/codecov-action@v5
      with:
        directory: build/tests/CMakeFiles/
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
